</style></head><body><div class="desktop"><main class="window"><div class="titlebar"><span>🏠 GUNWOOK MINI ROOM</span><div class="window-controls"><span>_</span><span>□</span><span>×</span></div></div><nav class="toolbar"><button type="button" onclick="location.href='index.html'">⌂ 홈으로 돌아가기</button><span class="toolbar-note">♡ MINI ROOM</span></nav><div class="mr-page" id="miniroomApp"><div class="mr-panel"><div class="mr-heading">♡ GUNWOOK MINI ROOM</div><section id="mrWelcome" class="mr-welcome"><h2>♡ 나만의 미니룸 ♡</h2><p>닉네임만 정하면 바로 방을 꾸밀 수 있어요!<br>가구를 배치하고 나만의 공간을 만들어 보세요.</p><input id="mrNickname" maxlength="20" placeholder="닉네임 (2~20자)" autocomplete="nickname"><button class="mr-action" id="mrStart" type="button">♡ 내 방 만들기</button><p class="mr-note">현재 기기의 브라우저에 로그인 정보가 저장됩니다.<br>계정 연결 전에는 브라우저 데이터 삭제 시 방에 접근하지 못할 수 있어요.</p></section><section id="mrEditor" hidden><div class="mr-top"><h2 id="mrNicknameLabel">나의 방</h2><div class="mr-top-actions"><button id="mrRename" type="button">닉네임 변경</button><button id="mrEditLayout" type="button">♡ 홈 꾸미기</button><button id="mrUndo" type="button" disabled>↶ 이전으로</button><button id="mrResetFurniture" type="button">가구 전체 치우기</button><button id="mrRemove" type="button" disabled>선택한 가구 치우기</button><button id="mrSaveLayout" type="button" disabled>♡ 배치 저장하기</button><button id="mrAccount" type="button">계정 연결 안내</button></div></div><div class="mr-layout"><div class="mr-stage"><div class="mr-scene" id="mrScene"><svg class="mr-room-art" viewBox="0 0 720 510" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid meet">

/* 기존 miniroom.js는 수정하지 않고 상점 UI 및 벽지/타일만 확장 */
(()=>{
'use strict';
const shop=document.getElementById('mrShop'),nav=document.getElementById('mrShopNav'),pager=document.getElementById('mrShopPager'),count=document.getElementById('mrShopCount');
const art=document.querySelector('#mrScene .mr-room-art');
if(!shop||!nav||!art)return;
const originals=Array.from(shop.querySelectorAll('.mr-shop-item'));
const names=['2층 벙커침대','그로밋 인형','헬창 꼬부기','구름 소파','별 조명','작은 책상','선물 상자','기아','1인 1닭 치킨 이용권'];
const cats=['가구','캐릭터','소품','가구','소품','가구','소품','캐릭터','소품'];
const products=originals.map((button,i)=>({name:names[i]||'가구',cat:cats[i]||'가구',button,kind:'furniture'}));
const skins=[
 {id:'wall-cream',cat:'벽지',name:'크림 벽지',kind:'wall',base:'#fff9ef',side:'#f5f0ed',trim:'#eee5f0'},
 {id:'wall-pink',cat:'벽지',name:'딸기우유 벽지',kind:'wall',base:'#ffe7ef',side:'#f7dbe8',trim:'#efd4e6'},
 {id:'wall-lavender',cat:'벽지',name:'라벤더 벽지',kind:'wall',base:'#f1e6ff',side:'#e7d9f7',trim:'#ded0ef'},
 {id:'wall-blue',cat:'벽지',name:'하늘빛 벽지',kind:'wall',base:'#e6f3ff',side:'#dcecf9',trim:'#d6e6f6'},
 {id:'wall-mint',cat:'벽지',name:'민트 벽지',kind:'wall',base:'#e6f7ec',side:'#d8eee2',trim:'#d3e8dc'},
 {id:'wall-peach',cat:'벽지',name:'복숭아 벽지',kind:'wall',base:'#ffebde',side:'#f8e1d6',trim:'#f0d8d6'},
 {id:'tile-wood',cat:'바닥 타일',name:'크림 원목',kind:'tile',base:'#f7eddb',line:'#e6d6c5'},
 {id:'tile-pink',cat:'바닥 타일',name:'핑크 타일',kind:'tile',base:'#fbe2ed',line:'#e5bfd3'},
 {id:'tile-lavender',cat:'바닥 타일',name:'라벤더 타일',kind:'tile',base:'#eee2fb',line:'#d5c1e9'},
 {id:'tile-mint',cat:'바닥 타일',name:'민트 타일',kind:'tile',base:'#e3f5eb',line:'#c2dfd1'},
 {id:'tile-blue',cat:'바닥 타일',name:'하늘 타일',kind:'tile',base:'#e2f1ff',line:'#c3dbea'},
 {id:'tile-choco',cat:'바닥 타일',name:'코코아 원목',kind:'tile',base:'#e7cdb7',line:'#cda98f'}
];
let selected='전체 아이템',page=1;
const perPage=12;
const wallPaths=Array.from(art.querySelectorAll('g > path')).filter(p=>p.getAttribute('d')?.startsWith('M122 178L360 60')||p.getAttribute('d')?.startsWith('M360 60L598 178'));
const wains=Array.from(art.querySelectorAll('g > path')).filter(p=>p.getAttribute('d')?.startsWith('M122 298L360 180')||p.getAttribute('d')?.startsWith('M360 180L598 298'));
const wood=art.querySelector('#mrWood');
const woodRect=wood?.querySelector('rect');
const woodLines=wood?.querySelectorAll('path');
const all=products.concat(skins);
const tabs=['전체 아이템','가구','소품','캐릭터','벽지','바닥 타일'];
const storageKey='gunwook-miniroom-decoration-v1';
let decorationEditing=false;
document.addEventListener('gunwook:editmode',e=>{decorationEditing=!!e.detail.editing;});
let applied={wall:'wall-cream',tile:'tile-wood'};
try{const stored=JSON.parse(localStorage.getItem(storageKey)||'{}');if(skins.some(s=>s.id===stored.wall))applied.wall=stored.wall;if(skins.some(s=>s.id===stored.tile))applied.tile=stored.tile;}catch{}
function apply(){
 const wall=skins.find(s=>s.id===applied.wall),tile=skins.find(s=>s.id===applied.tile);
 if(wallPaths[0])wallPaths[0].setAttribute('fill',wall.base);
 if(wallPaths[1])wallPaths[1].setAttribute('fill',wall.side);
 if(wains[0])wains[0].setAttribute('fill',wall.trim);
 if(wains[1])wains[1].setAttribute('fill',wall.trim);
 if(woodRect)woodRect.setAttribute('fill',tile.base);
 woodLines?.forEach(p=>p.setAttribute('stroke',tile.line));
 try{localStorage.setItem(storageKey,JSON.stringify(applied));}catch{}
}
function decorate(btn,p){
 btn.classList.add('mr-shop-item');
 btn.setAttribute('aria-label',p.name+' 무료');
 let ico=btn.querySelector('.mr-shop-icon');
 if(!ico){ico=document.createElement('span');ico.className='mr-shop-icon';btn.prepend(ico);}
 if(p.kind!=='furniture'){
  ico.replaceChildren();const swatch=document.createElement('span');swatch.className='mr-swatch';
  swatch.style.background=p.kind==='wall'?`linear-gradient(135deg,${p.base} 50%,${p.side} 50%)`:`repeating-linear-gradient(0deg,transparent 0 16px,${p.line} 17px 18px),repeating-linear-gradient(90deg,${p.base} 0 17px,${p.line} 18px 19px)`;
  ico.append(swatch);
  btn.addEventListener('click',()=>{if(!decorationEditing){document.getElementById('mrStatus').textContent='♡ 벽지와 타일은 홈 꾸미기 상태에서만 변경할 수 있어요.';return;}if(applied[p.kind]===p.id)return;document.dispatchEvent(new Event('gunwook:decor-before-change'));applied[p.kind]=p.id;apply();render();const save=document.getElementById('mrSaveLayout');if(save)save.disabled=false;document.getElementById('mrStatus').textContent='♡ '+p.name+' 적용 완료! 배치 저장하기를 눌러주세요.';});
 }
 let name=btn.querySelector('.mr-product-name');if(!name){name=document.createElement('span');name.className='mr-product-name';btn.append(name);}name.textContent=p.name;
 const price=document.createElement('span');price.className='mr-product-price';price.textContent='0 코인';
 const free=document.createElement('span');free.className='mr-product-free';free.textContent='FREE';
 btn.append(price,free);
}
products.forEach(p=>{p.button.querySelectorAll('.mr-shop-item > span:not(.mr-shop-icon)').forEach(n=>n.remove());decorate(p.button,p);});
skins.forEach(p=>{const b=document.createElement('button');b.type='button';p.button=b;decorate(b,p);});
function render(){
 nav.replaceChildren();tabs.forEach(tab=>{const b=document.createElement('button');b.type='button';b.className='mr-shop-tab';b.textContent=tab;b.setAttribute('aria-selected',String(selected===tab));b.onclick=()=>{selected=tab;page=1;render();};nav.append(b);});
 const visible=all.filter(p=>selected==='전체 아이템'||p.cat===selected);
 const pages=Math.max(1,Math.ceil(visible.length/perPage));page=Math.min(page,pages);
 count.textContent=selected+' · '+visible.length+'개';shop.replaceChildren();
 visible.slice((page-1)*perPage,page*perPage).forEach(p=>{p.button.classList.toggle('is-applied',p.kind!=='furniture'&&applied[p.kind]===p.id);shop.append(p.button);});
 pager.replaceChildren();if(pages>1)for(let i=1;i<=pages;i++){const b=document.createElement('button');b.type='button';b.textContent=i;b.setAttribute('aria-current',i===page?'page':'false');b.onclick=()=>{page=i;render();};pager.append(b);}
}
window.gunwookDecor={get:()=>({...applied}),set:(value)=>{applied={...value};apply();render();}};
apply();render();
})();
</script><script>
/* 강아지: 바닥 클릭 시 걸어가기, 직접 드래그 이동도 유지 */
(()=>{
 const bear=document.getElementById('mrBearCharacter');
 const svg=bear?.ownerSVGElement;
 if(!bear||!svg)return;
 const key='gunwook-bear-position-v1', W=64,H=79;
 const idleSprite='miniroom-assets/bear-z.png';
 const walkSprites=[1,2,3,4].map(n=>'miniroom-assets/bear-walk-'+n+'.png');
 walkSprites.forEach(url=>{const img=new Image();img.src=url;});
 let frame=-1;
 function setFrame(n){if(frame===n)return;frame=n;bear.setAttribute('href',n<0?idleSprite:walkSprites[n]);}
 const inside=(cx,foot)=>foot>=240&&foot<=447&&Math.abs(cx-360)<=Math.max(0,238*Math.min((foot-220)/118,(457-foot)/119)-12);
 const stage=document.getElementById('mrScene');
 let editing=false;
 document.addEventListener('gunwook:editmode',e=>{editing=!!e.detail.editing;bear.style.display=editing?'none':'';if(editing)stop();});
 let x=328,y=284,dragging=false,dx=0,dy=0,raf=0,walking=false;
 try{const p=JSON.parse(localStorage.getItem(key)||'null');if(p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&inside(p.x+W/2,p.y+H)){x=p.x;y=p.y;}}catch{}
 function save(){try{localStorage.setItem(key,JSON.stringify({x,y}));}catch{}}
 function render(bob=0){bear.setAttribute('x',x);bear.setAttribute('y',y+bob);}
 function point(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):null;}
 function stop(){if(raf)cancelAnimationFrame(raf);raf=0;walking=false;setFrame(-1);render();}
 function walkTo(cx,foot){
   if(!inside(cx,foot))return;
   stop();const tx=cx-W/2,ty=foot-H,sx=x,sy=y,dist=Math.hypot(tx-sx,ty-sy);
   if(dist<2){x=tx;y=ty;render();save();return;}
   const duration=Math.max(280,dist/0.105),start=performance.now();walking=true;
   function tick(now){const t=Math.min(1,(now-start)/duration);x=sx+(tx-sx)*t;y=sy+(ty-sy)*t;
     // 픽셀 캐릭터가 쪼르르 걷는 느낌: 2px 위아래 발걸음
     if(t<1){setFrame(Math.floor((now-start)/145)%4);}else{setFrame(-1);}
     render(t<1?-(Math.sin(t*dist/5)**2)*1.2:0);
     if(t<1&&walking)raf=requestAnimationFrame(tick);else{raf=0;walking=false;render();save();}
   }
   raf=requestAnimationFrame(tick);
 }
 render();
 // 바닥 영역만 클릭 반응: 벽/상점/가구 클릭은 그대로
 if(stage){stage.addEventListener('click',e=>{
   if(editing||dragging||e.target.closest?.('button'))return;const p=point(e);if(p)walkTo(p.x,p.y);
 });}
 bear.addEventListener('pointerdown',e=>{if(editing)return;const p=point(e);if(!p)return;stop();dragging=true;dx=p.x-x;dy=p.y-y;bear.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();});
 bear.addEventListener('pointermove',e=>{if(!dragging)return;const p=point(e);if(!p)return;const nx=p.x-dx,ny=p.y-dy;if(inside(nx+W/2,ny+H)){x=nx;y=ny;render();}});
 function finish(){if(!dragging)return;dragging=false;save();}
 bear.addEventListener('pointerup',finish);bear.addEventListener('pointercancel',finish);
 bear.addEventListener('click',e=>e.stopPropagation());
})();
</script></body></html>
