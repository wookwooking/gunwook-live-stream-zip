<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUNWOOK MINI ROOM</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="miniroom.css"></head><body><div class="desktop"><main class="window"><div class="titlebar"><span>🏠 GUNWOOK MINI ROOM</span><div class="window-controls"><span>_</span><span>□</span><span>×</span></div></div><nav class="toolbar"><button type="button" onclick="location.href='index.html'">◀ LIVE ARCHIVE로 돌아가기</button><span class="toolbar-note">♡ MINI ROOM</span></nav><div class="mr-page" id="miniroomApp"><div class="mr-panel"><div class="mr-heading">♡ GUNWOOK MINI ROOM</div><section id="mrWelcome" class="mr-welcome"><h2>♡ 나만의 미니룸 ♡</h2><p>닉네임만 정하면 바로 방을 꾸밀 수 있어요!<br>가구를 배치하고 나만의 공간을 만들어 보세요.</p><input id="mrNickname" maxlength="20" placeholder="닉네임 (2~20자)" autocomplete="nickname"><button class="mr-action" id="mrStart" type="button">♡ 내 방 만들기</button><p class="mr-note">현재 기기의 브라우저에 로그인 정보가 저장됩니다.<br>계정 연결 전에는 브라우저 데이터 삭제 시 방에 접근하지 못할 수 있어요.</p></section><section id="mrEditor" hidden><div class="mr-top"><h2 id="mrNicknameLabel">나의 방</h2><div class="mr-top-actions"><button id="mrRename" type="button">닉네임 변경</button><button id="mrRemove" type="button" disabled>선택한 가구 치우기</button><button id="mrAccount" type="button">계정 연결 안내</button></div></div><div class="mr-layout"><div class="mr-stage"><div class="mr-scene"><div class="mr-wall-left"></div><div class="mr-wall-right"></div><div class="mr-floor" id="mrFloor" aria-label="가구를 배치하는 방 바닥"></div></div></div><div class="mr-panel"><div class="mr-heading">✧ FURNITURE SHOP</div><p class="mr-help">가구를 누르면 방에 추가돼요. 가구를 드래그해서 원하는 위치로 옮겨 보세요!<br>첫 버전의 모든 가구는 무료예요 ♡</p><div class="mr-shop" id="mrShop"></div></div></div></section><p class="mr-status" id="mrStatus" role="status" aria-live="polite"></p></div></div><footer>💙 건욱이 애정하기 💙</footer></main></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="miniroom.js"></script></body></html>
