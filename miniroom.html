6ef"/></pattern></defs><rect x="42" y="16" width="636" height="482" rx="12" fill="#ffe1c9"/><rect x="42" y="16" width="636" height="482" rx="12" fill="url(#mrStars)"/><path d="M111 175L360 49L609 175L609 335L360 463L111 335Z" fill="#e9a8bd"/><path d="M122 178L360 60L360 220L122 338Z" fill="#ffe3ef" stroke="#e5abc7" stroke-width="4"/><path d="M360 60L598 178L598 338L360 220Z" fill="#ffd1e1" stroke="#e5abc7" stroke-width="4"/><path d="M122 338L360 220L598 338L360 457Z" fill="url(#mrCheck)" stroke="#d8a5bd" stroke-width="6"/><path d="M122 338L360 457L598 338L598 353L360 473L122 353Z" fill="#eab0c4"/><path d="M360 60V220" stroke="#dca0bd" stroke-width="4"/><path d="M122 178L360 60L598 178" fill="none" stroke="#fff7fb" stroke-width="13" stroke-linejoin="round"/><path d="M152 230l36-18v82l-36 19z" fill="#f7bda7" stroke="#d39d9d" stroke-width="3"/><path d="M163 237l15-8v59l-15 8z" fill="#ffe3c6"/><circle cx="172" cy="269" r="3" fill="#b47c8e"/><path d="M532 212l36 18v82l-36-18z" fill="#f7bda7" stroke="#d39d9d" stroke-width="3"/><path d="M543 229l15 8v59l-15-8z" fill="#ffe3c6"/><circle cx="550" cy="269" r="3" fill="#b47c8e"/></svg><div class="mr-floor" id="mrFloor" aria-label="가구를 배치하는 방 바닥"></div></div></div><div class="mr-panel"><div class="mr-heading">✧ FURNITURE SHOP</div><p class="mr-help">가구를 누르면 방에 추가돼요. 가구를 드래그해서 원하는 위치로 옮겨 보세요!<br>첫 버전의 모든 가구는 무료예요 ♡</p><div class="mr-shop" id="mrShop"></div></div></div></section><p class="mr-status" id="mrStatus" role="status" aria-live="polite"></p></div></div><footer>💙 건욱이 애정하기 💙</footer></main></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="miniroom.js"></script></body></html>
