<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Video Archive ✧ Windows 98</title><link rel="stylesheet" href="style.css"></head><body><div class="desktop"><main class="window"><div class="titlebar"><span>📼 PARKGUNWOOK LIVE STREAM ZIP.exe</span><div class="window-controls"><span>_</span><span>□</span><span>×</span></div></div><nav class="toolbar"><button type="button" id="homeButton">⌂ 홈</button><button type="button" id="adminToggle">🔐 관리자</button><span class="toolbar-note">@wookwooking</span></nav><div class="workspace"><section class="panel calendar-panel"><div class="panel-title">🗓 CALENDAR</div><div class="month-nav"><button id="prev" aria-label="이전 달">◀</button><strong><span id="monthName"></span> <span id="yearLabel"></span></strong><button id="next" aria-label="다음 달">▶</button></div><div class="weekdays"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div><div id="days" class="days"></div><div class="legend"><span class="mark"></span> 영상 등록일에 마크 생성</div><div class="month-meta">MONTH <span id="bigMonth"></span></div></section><section class="panel video-panel"><div class="panel-title">🎞 VIDEO COLLECTION</div><div class="empty-message" id="emptyMessage">✧ 날짜 선택 시 해당 영상 표시<p>Click a date to open your memories ♡</p></div><section id="videos" hidden><div class="video-heading"><h2 id="selectedTitle"></h2><button id="closeVideos" aria-label="영상 닫기">×</button></div><div id="videoList"></div></section></section></div><section id="admin" class="admin panel" hidden><div class="panel-title">🔐 ADMIN CONTROL PANEL</div><p id="adminInfo"></p><form id="loginForm"><label>관리자 이메일<input type="email" id="email" required></label><label>비밀번호<input type="password" id="password" required></label><button type="submit">로그인</button></form><div id="editor" hidden><button id="logout" type="button">로그아웃</button><form id="videoForm"><label>날짜<input type="date" id="date" required></label><label>영상 제목<input id="title" maxlength="120" required></label><label>YouTube 링크<input type="url" id="url" placeholder="https://youtu.be/..." required></label><button class="primary" type="submit">♡ 영상 등록</button></form></div><p id="status" role="status"></p></section><footer>✧ 건욱이 애정하기</footer></main></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="app.js"></script><script src="cursor-effects.js"></script><script>document.getElementById('homeButton').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});new MutationObserver(()=>{document.getElementById('emptyMessage').hidden=!document.getElementById('videos').hidden}).observe(document.getElementById('videos'),{attributes:true,attributeFilter:['hidden']});</script></body></html>
